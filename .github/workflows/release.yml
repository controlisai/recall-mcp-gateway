name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test -race -count=1 ./internal/...

      - name: Cross-compile
        run: make release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/

      - name: Prepare binaries
        run: |
          chmod +x dist/recall-mcp-gateway-linux-amd64
          chmod +x dist/recall-mcp-gateway-linux-arm64

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (prerelease)
        if: steps.version.outputs.is_prerelease == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            controlisai/recall-mcp-gateway:${{ steps.version.outputs.tag }}
            ghcr.io/controlisai/recall-mcp-gateway:${{ steps.version.outputs.tag }}

      - name: Build and push (stable)
        if: steps.version.outputs.is_prerelease == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            controlisai/recall-mcp-gateway:${{ steps.version.outputs.tag }}
            controlisai/recall-mcp-gateway:latest
            ghcr.io/controlisai/recall-mcp-gateway:${{ steps.version.outputs.tag }}
            ghcr.io/controlisai/recall-mcp-gateway:latest

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'rc') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  npm:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Update package version
        working-directory: npm
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Update install.js version
        working-directory: npm
        run: sed -i "s/const VERSION = \".*\"/const VERSION = \"${{ steps.version.outputs.version }}\"/" install.js

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public --tag ${{ steps.version.outputs.tag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  helm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/recall-mcp-gateway

      - name: Package chart
        run: helm package charts/recall-mcp-gateway --version ${{ steps.version.outputs.tag }} --app-version ${{ steps.version.outputs.tag }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        run: helm push recall-mcp-gateway-${{ steps.version.outputs.tag }}.tgz oci://ghcr.io/controlisai/charts

  homebrew:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get checksums
        id: checksums
        run: |
          echo "darwin_arm64=$(grep darwin-arm64 dist/checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "darwin_amd64=$(grep darwin-amd64 dist/checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(grep linux-arm64 dist/checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(grep linux-amd64 dist/checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: controlisai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap/Formula
          sed -i 's|version ".*"|version "${{ steps.version.outputs.version }}"|' recall-mcp-gateway.rb
          sed -i 's|/v[0-9][^/]*/|/v${{ steps.version.outputs.version }}/|g' recall-mcp-gateway.rb
          # Update SHA256s in order: darwin-arm64, darwin-amd64, linux-arm64, linux-amd64
          python3 -c "
          import re
          with open('recall-mcp-gateway.rb') as f:
              content = f.read()
          shas = re.findall(r'sha256 \"([a-f0-9]{64})\"', content)
          replacements = {
              shas[0]: '${{ steps.checksums.outputs.darwin_arm64 }}',
              shas[1]: '${{ steps.checksums.outputs.darwin_amd64 }}',
              shas[2]: '${{ steps.checksums.outputs.linux_arm64 }}',
              shas[3]: '${{ steps.checksums.outputs.linux_amd64 }}',
          }
          for old, new in replacements.items():
              content = content.replace(old, new, 1)
          with open('recall-mcp-gateway.rb', 'w') as f:
              f.write(content)
          "

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/recall-mcp-gateway.rb
          git diff --staged --quiet && exit 0
          git commit -m "Update recall-mcp-gateway to v${{ steps.version.outputs.version }}"
          git push
