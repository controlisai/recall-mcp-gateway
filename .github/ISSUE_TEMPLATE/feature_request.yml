name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please describe the use case so we can understand the problem you're solving.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this feature solve? What use case does it enable?
      placeholder: "When I try to..., I need to..., but currently..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternatives have you considered?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core (rules, baselines, detection, audit)
        - Dashboard
        - Auth & Security
        - Protocol (MCP spec)
        - Deployment (Docker, Helm, config)
        - Documentation
        - Other
    validations:
      required: true
