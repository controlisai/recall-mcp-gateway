name: Bug Report
description: Report a bug in Recall MCP Gateway
labels: ["bug", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below to help us reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Configure gateway with...
        2. Send tool call...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages or logs if available.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gateway version
      description: Output of `recall-mcp-gateway --version`
      placeholder: "v1.0.0-beta.1"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Standalone (SQLite)
        - PostgreSQL (single-pod)
        - Multi-pod (PostgreSQL + Redis)
        - Docker
        - Kubernetes (Helm)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Platform
      placeholder: "macOS 15.1 (ARM), Ubuntu 24.04 (amd64), etc."
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant parts of your config (redact secrets!).
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Gateway logs around the time of the issue.
      render: text
