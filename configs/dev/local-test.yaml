proxy:
  port: 8090
  dashboard: true

servers:
  - name: postgres-mydb
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres", "postgresql://postgres:password@localhost:5432/mydb"]
  - name: atlassian
    transport: oauth
    url: https://mcp.atlassian.com/v1/mcp
