{{- if gt (int .Values.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "recall-mcp-gateway.fullname" . }}
  labels:
    {{- include "recall-mcp-gateway.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "recall-mcp-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
